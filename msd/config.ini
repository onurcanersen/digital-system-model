[config_mgmt_db]
source_name = mysql
access_method = mysql
connection_address = localhost:3306/cmdb
user_info = dsm:dsm

[source_code_repo]
source_name = gitea
access_method = git
connection_address = http://localhost:3001/dsm-src
user_info = dsm:dsm

[analyzer]
dummy_topic_names = DummyTopic
import_domain_prefix = a.b.c
dependency_suffixes = _lib
makefile_include_patterns = include/Makefile_java.mk
custom_topic_name = topic
run_build = false

[workspace]
path = workspace

[api]
host = 127.0.0.1
port = 8080

[worker]
broker_url = redis://localhost:6379/0
result_backend = redis://localhost:6379/1
